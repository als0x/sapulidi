# A directory named .venv or venv is a candidate only when it holds pyvenv.cfg (the scan checks that: a
# hand-made folder called venv is kept).
[[rule]]
id = "venv"
rev = 1
category = "deps"
bucket = "optional"
kind = "project"
names = [".venv", "venv"]
markers = ["pyproject.toml", "setup.py", "setup.cfg", "requirements*.txt", "tox.ini", "noxfile.py"]
min_age = "30d"

[[rule]]
id = "tox-nox"
rev = 1
category = "deps"
bucket = "optional"
kind = "project"
names = [".tox", ".nox"]
markers = ["pyproject.toml", "setup.py", "setup.cfg", "requirements*.txt", "tox.ini", "noxfile.py"]
min_age = "30d"

[[rule]]
id = "build"
rev = 1
category = "build-output"
bucket = "optional"
kind = "project"
names = ["build"]
markers = ["pyproject.toml", "setup.py"]
min_age = "7d"

[[rule]]
id = "egg-info"
rev = 1
category = "build-output"
bucket = "optional"
kind = "project"
names = ["*.egg-info"]
markers = ["pyproject.toml", "setup.py"]
min_age = "7d"
