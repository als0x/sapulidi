pack = "python"

# Per-project Python artefacts. Markers decide what counts as a Python project; a conda environment
# (conda-meta/) is never a candidate, whatever its name.

[[rule]]
id = "pycache"
rev = 1
category = "test-artefacts"
bucket = "auto"
kind = "project"
names = ["__pycache__"]
markers = ["pyproject.toml", "setup.py", "setup.cfg", "requirements*.txt", "*.py"]
min_age = "3h"

[[rule]]
id = "pytest-cache"
rev = 1
category = "test-artefacts"
bucket = "auto"
kind = "project"
names = [".pytest_cache"]
markers = ["pyproject.toml", "setup.py", "setup.cfg", "requirements*.txt", "*.py"]
min_age = "3h"

