# Prunes that remove only unreferenced entries may run weekly (category mcp-runtime).

[[rule]]
id = "uv-prune"
rev = 1
category = "mcp-runtime"
bucket = "optional"
kind = "cache"
tool = "uv"
action = "prune"
min_age = "24h"

