pack = "caches"

# Global package-manager and runtime caches. Each is cleaned only by its tool's own command, as a whole, so `age`
# does not apply: these run only in the low-disk tier, largest first, and only when the category is enabled.
# min_age is the validator's minimum for an optional rule.

[[rule]]
id = "go-clean-cache"
rev = 1
category = "caches"
bucket = "optional"
kind = "cache"
tool = "go"
action = "clean-cache"
min_age = "24h"

