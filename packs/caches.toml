# Gradle daemon logs are plain files nobody reads after a week. Optional (not auto) because the caches
# category is optional.

[[rule]]
id = "gradle-daemon-logs"
rev = 1
category = "caches"
bucket = "optional"
kind = "path"
location = "gradle-daemon-logs"
min_age = "7d"
