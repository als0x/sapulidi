# Report-only: no official command cleans exactly these, so they are shown and never touched.

[[rule]]
id = "npm-npx"
rev = 1
category = "caches"
bucket = "never"
kind = "path"
location = "npm-npx"

[[rule]]
id = "gradle-caches"
rev = 1
category = "caches"
bucket = "never"
