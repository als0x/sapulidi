pack = "temp"

# Leftovers that build and test tools write directly into the user's temp dir. There is no broad `tmp*` rule:
# other programs share that directory.

[[rule]]
id = "go-build"
rev = 1
category = "temp"
bucket = "auto"
kind = "temp"
names = ["go-build*"]
min_age = "1h"

[[rule]]
id = "pytest"
rev = 1
category = "temp"
bucket = "auto"
kind = "temp"
names = ["pytest-of-*"]
min_age = "2h"

[[rule]]
id = "pip"
rev = 1
category = "temp"
bucket = "auto"
kind = "temp"
names = ["pip-*"]
min_age = "2h"

